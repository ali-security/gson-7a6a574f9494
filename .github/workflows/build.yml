name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests with reasons
        run: |
          echo "Skipped tests (from surefire XML reports):"
          awk '/<testcase /{tc=$0} /<skipped/{print FILENAME ": " tc; print "    " $0}' */target/surefire-reports/TEST-*.xml
          echo "Note: JsonReaderPathTest.multipleTopLevelValuesInOneDocument uses assumeTrue(factory == Factory.STRING_READER);"
          echo "it is skipped by design for the JsonTreeReader parameter because lenient multiple top-level values only apply to the streaming reader."
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
